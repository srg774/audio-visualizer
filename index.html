<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SRG774 Music - Lite (Boosted)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"/>
    <script data-goatcounter="https://srg774.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

    <style>
        :root {
            --primary-color: #00bfff;
            --secondary-color: #00f;
            --text-color: white;
            --background-color: #000;
            --seek-bar-bg: #555;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        h1 { font-size: 1.5rem; margin-bottom: 20px; min-height: 2.5rem; padding: 0 15px; }
        .controls { display: flex; gap: 15px; justify-content: center; align-items: center; }
        
        .icon-button {
            background: none; border: none; color: var(--text-color);
            cursor: pointer; width: 50px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .icon-button:active { transform: scale(0.9); color: var(--primary-color); }

        .seek-bar-container { width: 80%; max-width: 500px; height: 20px; margin: 20px auto; cursor: pointer; display: flex; align-items: center; }
        .seek-bar { width: 100%; height: 6px; background: var(--seek-bar-bg); border-radius: 3px; position: relative; }
        .seek-bar-progress { height: 100%; background: linear-gradient(90deg, var(--secondary-color), var(--primary-color)); width: 0%; border-radius: 3px; }

        .shimmer-effect {
            background: linear-gradient(to right, #ffffff, #87ceeb, #ffffff);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer { from {background-position: 200% 0;} to {background-position: -200% 0;} }
        
        footer { margin-top: 20px; font-size: 0.8rem; opacity: 0.7; }
        .status-message { position: fixed; bottom: 20px; background: #333; padding: 8px 15px; border-radius: 5px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .status-message.show { opacity: 1; }
    </style>
</head>
<body>

    <h1 id="current-track-display">Loading...</h1>

    <div class="controls">
        <button id="prev-button" class="icon-button" aria-label="Previous Track">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="play-pause-button" class="icon-button" aria-label="Play or Pause">
            <svg id="play-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="next-button" class="icon-button" aria-label="Next Track">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
    </div>

    <div class="seek-bar-container" id="seek-container">
        <div class="seek-bar">
            <div class="seek-bar-progress" id="seek-bar-progress"></div>
        </div>
    </div>

    <!-- playsinline helps mobile browsers keep playback steady -->
    <audio id="audio" crossorigin="anonymous" preload="auto" playsinline></audio>

    <footer>
        <p>SRG774 © | <button id="refresh-tracks-button" style="background:none; border:none; color:cyan; cursor:pointer;">Refresh</button></p>
    </footer>

    <div id="status-message" class="status-message"></div>

<script>
    let tracks = [];
    let currentTrackIndex = 0;
    let currentObjectUrl = null;
    
    // Concurrency & Preload controls
    let currentAbortController = null;
    let loadRequestId = 0;
    let preloadedNext = { index: -1, blobUrl: null };
    let msgTimeout = null;

    let audioCtx;
    let gainNode;
    let source;

    const audio = document.getElementById('audio');
    const playPauseBtn = document.getElementById('play-pause-button');
    const trackDisplay = document.getElementById('current-track-display');
    const progressBar = document.getElementById('seek-bar-progress');
    const statusMsg = document.getElementById('status-message');

    const pauseSVG = '<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
    const playSVG = '<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            source = audioCtx.createMediaElementSource(audio);
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            setupMediaSession();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
    }

    // --- BLUETOOTH / VEHICLE / LOCKSCREEN CONTROL LOGIC ---
    function setupMediaSession() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => {
                initAudio();
                audio.play().catch(() => {});
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                audio.pause();
            });
            navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
            navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
            navigator.mediaSession.setActionHandler('seekbackward', () => {
                audio.currentTime = Math.max(audio.currentTime - 5, 0);
            });
            navigator.mediaSession.setActionHandler('seekforward', () => {
                audio.currentTime = Math.min(audio.currentTime + 5, audio.duration || 0);
            });
        }
    }

    async function fetchTracks() {
        try {
            const res = await fetch('tracks.json?t=' + Date.now()); // Avoid stale cache on refresh
            tracks = await res.json();
            if (tracks.length > 0) loadTrack(0, false);
        } catch (e) {
            showMsg("Error loading playlist");
        }
    }

    // Background preloader for the upcoming track so autoplay transitions are instant
    async function preloadNextTrack(nextIndex) {
        if (tracks.length <= 1 || document.hidden) return;
        if (preloadedNext.index === nextIndex && preloadedNext.blobUrl) return;

        // Clean up old preload if index changed
        if (preloadedNext.blobUrl) {
            URL.revokeObjectURL(preloadedNext.blobUrl);
            preloadedNext = { index: -1, blobUrl: null };
        }

        try {
            const res = await fetch(tracks[nextIndex].src);
            if (!res.ok) return;
            const blob = await res.blob();
            // Ensure we still want this track preloaded
            if (((currentTrackIndex + 1) % tracks.length) === nextIndex) {
                preloadedNext = {
                    index: nextIndex,
                    blobUrl: URL.createObjectURL(blob)
                };
            }
        } catch (e) {
            // Silently ignore preload errors; main loader will handle fallback
        }
    }

    async function loadTrack(index, shouldPlay = false) {
        if (!tracks.length) return;

        // 1. Increment request ID & abort any in-flight download immediately
        const thisRequestId = ++loadRequestId;
        if (currentAbortController) {
            currentAbortController.abort();
        }
        currentAbortController = new AbortController();

        // 2. Immediately stop current audio and reset progress bar so toggles feel instant
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        progressBar.style.width = '0%';
        playPauseBtn.innerHTML = shouldPlay ? pauseSVG : playSVG;

        currentTrackIndex = index;
        const track = tracks[index];

        // 3. Update UI & Lockscreen Metadata immediately
        trackDisplay.innerHTML = `<span class="shimmer-effect">${track.title}</span>`;
        if (track.isNew) trackDisplay.innerHTML += ' <small style="color:gold">NEW</small>';

        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: track.title,
                artist: 'SRG774',
                album: 'Lite Boosted',
                artwork: [
                    { src: 'https://via.placeholder.com/512', sizes: '512x512', type: 'image/png' }
                ]
            });
            navigator.mediaSession.playbackState = shouldPlay ? 'playing' : 'paused';
        }

        // 4. Set Boost / Gain Value
        const boostValue = track.gain !== undefined ? track.gain : 1.0;
        if (gainNode) {
            gainNode.gain.value = boostValue;
        } else {
            audio.volume = Math.min(boostValue, 1.0);
        }

        // Revoke previous active Blob URL
        if (currentObjectUrl) {
            URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = null;
        }

        // Helper to start playback safely
        const startPlayback = async () => {
            if (thisRequestId !== loadRequestId) return; // Stale request check
            if (shouldPlay) {
                initAudio();
                try {
                    await audio.play();
                } catch (err) {
                    console.log("Playback interrupted or blocked:", err);
                    playPauseBtn.innerHTML = playSVG;
                }
            }
            // Preload the next track in line
            preloadNextTrack((index + 1) % tracks.length);
        };

        // 5. Check if this track was already preloaded in RAM
        if (preloadedNext.index === index && preloadedNext.blobUrl) {
            currentObjectUrl = preloadedNext.blobUrl;
            preloadedNext = { index: -1, blobUrl: null };
            audio.src = currentObjectUrl;
            await startPlayback();
            return;
        }

        // 6. ANDROID BACKGROUND FIX:
        // If screen is off / tab is in background, skip fetch() blobbing and stream natively
        // so Android doesn't kill the network request during autoplay.
        if (document.hidden) {
            audio.src = track.src;
            await startPlayback();
            return;
        }

        showMsg("Loading track...");

        try {
            const response = await fetch(track.src, { signal: currentAbortController.signal });
            if (!response.ok) throw new Error("Network response failed");

            const blob = await response.blob();
            
            // If user clicked Next/Prev while downloading, discard this blob immediately
            if (thisRequestId !== loadRequestId) return;

            currentObjectUrl = URL.createObjectURL(blob);
            audio.src = currentObjectUrl;
            hideMsg();
            await startPlayback();

        } catch (err) {
            if (err.name === 'AbortError') return; // User skipped track; do nothing!
            if (thisRequestId !== loadRequestId) return;

            // Direct streaming fallback
            audio.src = track.src;
            hideMsg();
            await startPlayback();
        }
    }

    function togglePlay() {
        initAudio();
        if (audio.paused) {
            audio.play().catch(e => console.log("Playback failed:", e));
        } else {
            audio.pause();
        }
    }

    function nextTrack() {
        if (!tracks.length) return;
        loadTrack((currentTrackIndex + 1) % tracks.length, true);
    }

    function prevTrack() {
        if (!tracks.length) return;
        loadTrack((currentTrackIndex - 1 + tracks.length) % tracks.length, true);
    }

    // Keep UI icons and MediaSession strictly synced with actual audio state
    audio.onplay = () => {
        playPauseBtn.innerHTML = pauseSVG;
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    };

    audio.onpause = () => {
        playPauseBtn.innerHTML = playSVG;
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    };

    audio.onended = nextTrack;

    // If a stream stalls or errors on mobile, automatically advance after a brief pause
    audio.onerror = () => {
        if (audio.getAttribute('src')) {
            showMsg("Stream error, skipping...");
            setTimeout(() => {
                if (audio.error) nextTrack();
            }, 1500);
        }
    };

    playPauseBtn.onclick = togglePlay;
    document.getElementById('next-button').onclick = nextTrack;
    document.getElementById('prev-button').onclick = prevTrack;
    
    audio.ontimeupdate = () => {
        if (audio.duration && !isNaN(audio.duration)) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + '%';
            
            if ('mediaSession' in navigator) {
                try {
                    navigator.mediaSession.setPositionState({
                        duration: audio.duration,
                        playbackRate: audio.playbackRate,
                        position: audio.currentTime
                    });
                } catch (e) {}
            }
        }
    };

    document.getElementById('seek-container').onclick = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        if (audio.duration && !isNaN(audio.duration)) {
            audio.currentTime = pos * audio.duration;
        }
    };

    function showMsg(m) {
        statusMsg.innerText = m;
        statusMsg.classList.add('show');
        clearTimeout(msgTimeout);
        msgTimeout = setTimeout(hideMsg, 2000);
    }

    function hideMsg() {
        statusMsg.classList.remove('show');
    }

    document.getElementById('refresh-tracks-button').onclick = fetchTracks;
    window.onload = fetchTracks;
</script>
</body>
</html>
